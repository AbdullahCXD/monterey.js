name: CI

on: 
    push: 
        branches: [ develop ]

jobs:
    build_tsc:
        runs-on: ubuntu-latest
        
        steps:
            - uses: actions/checkout@v3
            
            - name: Setup Node.js
              uses: actions/setup-node@v3
              with:
                  node-version: '22'
                  
            - name: Install pnpm
              uses: pnpm/action-setup@v2
              with:
                  version: 10
                  
            - name: Install dependencies
              run: pnpm install
              
            - name: Build TypeScript
              run: pnpm build
